services:
  netpulse:
    image: node:20-alpine
    container_name: netpulse
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "[ -d node_modules ] || npm install --omit=dev --no-audit --no-fund; node server/index.js"]
    ports:
      - "8091:3000"
    volumes:
      - /DATA/AppData/netpulse/app:/app
      - /DATA/AppData/netpulse/data:/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - TZ=your-time-zone
